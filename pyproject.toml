[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-pricer"
version = "0.1.0"
description = "Monte Carlo option pricing under GBM with variance reduction, Greeks and QMC"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Cox" }]
requires-python = ">=3.11"
# The Streamlit app's packages are core dependencies so that any install route
# (uv sync, pip install ., or Streamlit Community Cloud reading uv.lock) can run app.py.
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
    "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.17",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mc_pricer"]
